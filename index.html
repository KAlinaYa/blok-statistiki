<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <link rel="stylesheet" href="css/style.css" >
    <title>Blok-statistiki</title>
  </head>
  <body>
    <div class="container">
      <article class="card">
        <div class="card__top card__flex">
          <div class="card__top-text">Подписчики</div>
          <div class="card__top-icon card__top-icon--purple"></div>
        </div>
        <div class="card__number">
          <p>12K</p>
        </div>
        <div class="card__bottom card__flex">
          <div class="card__bottom-text">За 30 дней</div>
          <span class="card__bottom-percent">+12%</span>
        </div>
      </article>
      <article class="card">
        <div class="card__top card__flex">
          <div class="card__top-text">Просмотры</div>
          <div class="card__top-icon card__top-icon--orange"></div>
        </div>
        <div class="card__number">
          <p>87K</p>
        </div>
        <div class="card__bottom card__flex">
          <div class="card__bottom-text">За неделю</div>
          <span class="card__bottom-percent">+4%</span>
        </div>
      </article>
      <article class="card">
        <div class="card__top card__flex">
          <div class="card__top-text">Продажи</div>
          <div class="card__top-icon card__top-icon--green"></div>
        </div>
        <div class="card__number">
          <p>324</p>
        </div>
        <div class="card__bottom card__flex">
          <div class="card__bottom-text">За месяц</div>
          <span class="card__bottom-percent">+18%</span>
        </div>
      </article>
    </div>
  </body>
</html>
